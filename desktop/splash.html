<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Outpick</title>
<style>
  html, body { height: 100%; margin: 0; background: #121014; color: #958e9e; font: 14px/1.4 -apple-system, "Segoe UI", Inter, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; -webkit-app-region: drag; }
  .name { color: #e6e8ee; font-weight: 600; font-size: 18px; letter-spacing: -.3px; }
  svg { overflow: visible; }
  .body { fill: #3a3540; animation: pulse 1.1s ease-in-out infinite; }
  .face { fill: #4a4452; animation: pulseFace 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { fill: #3a3540; filter: none; } 50% { fill: #e0a526; filter: drop-shadow(0 0 6px rgba(224,165,38,.8)); } }
  @keyframes pulseFace { 0%, 100% { fill: #4a4452; } 50% { fill: #ffd766; } }
</style></head>
<body><div class="wrap">
  <img src="icon.png" alt="" width="96" height="96" style="border-radius:22px">
  <div class="name">Outpick</div>
  <svg width="236" height="34" viewBox="0 0 236 34" id="c"></svg>
  <div id="t">запускаю…</div>
</div>
<script>
  // пять ромбиков-кристаллов без подставок, волна слева направо, пока поднимается сервер (как Crystals.tsx)
  const svg = document.getElementById("c"); const W = 34, G = 16.5, H = 34;
  for (let i = 0; i < 5; i++) {
    const x = i * (W + G), cx = x + W / 2, top = H * .02, side = H * .58, bottom = H * .98, face = H * .63;
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.style.animationDelay = (i * .18) + "s";
    g.innerHTML = `<path class="body" style="animation-delay:${i * .18}s" d="M${cx} ${top} L${x + W * .92} ${side} L${cx} ${bottom} L${x + W * .08} ${side} Z"/>` +
      `<path class="face" style="animation-delay:${i * .18}s" d="M${cx} ${top} L${x + W * .92} ${side} L${cx} ${face} Z"/>`;
    svg.appendChild(g);
  }
  const msgs = ["запускаю…", "поднимаю сервер…", "читаю данные…", "ещё секунду…"]; let k = 0;
  setInterval(() => { k = Math.min(k + 1, msgs.length - 1); document.getElementById("t").textContent = msgs[k]; }, 2500);
</script></body></html>
