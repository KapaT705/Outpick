name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Релиз открывается только когда обе сборки загрузили файлы. Раньше electron-builder публиковал его
# с первым же файлом, и Windows-клиенты, проверявшие обновление в эту минуту, получали 404 на latest.yml.
# Порядок: черновик -> сборки грузят в черновик -> публикация.
jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag must match package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # иначе сборка с новой меткой попала бы в релиз старой версии и перевыложила бы его
          [ "$GITHUB_REF_NAME" = "$TAG" ] || { echo "метка $GITHUB_REF_NAME, а версия в desktop/package.json $TAG"; exit 1; }
      - name: Create or reopen draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # релиз уже есть (например, заметки создали вручную): прячем в черновик, пока не загрузятся файлы
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "${TAG#v}" --notes ""
          fi

  build:
    needs: draft
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Install desktop deps
        run: npm ci
        working-directory: desktop
      - name: Prepare Next standalone bundle
        run: node scripts/prepare-app.mjs
        working-directory: desktop
      - name: Build and upload to the draft
        run: npx electron-builder ${{ matrix.args }} --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check that update files are uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$assets"
          for f in latest.yml latest-mac.yml; do echo "$assets" | grep -qx "$f" || { echo "нет $f в релизе $TAG"; exit 1; }; done
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
